<footer><button class="begin" id="begin">开始拆礼物 <span aria-hidden="true">✧</span></button><div class="progress" aria-live="polite"><div class="dots" id="dots" aria-hidden="true"></div><span id="progress-text">今夜已点亮：0 / 8</span><button class="final-button" id="final-button">再看星光</button></div></footer>
<div class="signature">a light left on for you</div><div id="toast" class="toast" role="status"></div>

<dialog id="card" class="card" aria-labelledby="card-title"><button class="close" id="close" aria-label="关闭卡片">×</button><div class="card-kicker" id="card-kicker">a small surprise</div><h2 id="card-title"></h2><div id="card-content"></div></dialog>
<dialog id="ending" class="card ending" aria-labelledby="ending-title"><div class="seal" aria-hidden="true">24</div><div class="card-kicker">all the stars, for you</div><h2 id="ending-title">今晚的星光，<br>全部为你亮起。</h2><p>24岁快乐。<br>愿你在新的一岁，<br>有更多自由，更多勇气，更多被爱的时刻。<br>愿你继续创造，继续生活，继续成为你自己。</p><p>如果世界偶尔太吵，<br>也别忘了给自己留一盏灯。</p><p>你已经走过了24个秋天。<br>接下来的人生，不必急着赶路。</p><button class="action" id="replay">再看一遍这个小世界</button><button class="quiet" id="finish">结束今晚的拆礼物</button></dialog>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),world=$('world'),stage=$('stage'),card=$('card'),ending=$('ending'),content=$('card-content');
const entries={
window:['灯还亮着','有些夜晚很长，\n长到像走不出去。\n但你已经这样走过很多次了。\n所以今晚这盏灯，是为你留的。','a light left on'],
cat:['允许你什么都不做','今天不需要证明自己。\n不需要高效，不需要厉害，\n不需要立刻把所有事都做好。\n你可以只是被喜欢着。','take a little rest'],
cake:['生日快乐','24岁快乐。\n愿你不是只在完成任务的时候，\n才觉得自己值得被奖励。\n愿快乐本身，也成为生活的一部分。','make a wish'],
flowers:['你在慢慢长成自己','有些成长不是突然发生的。\n它藏在一次次修改、坚持、怀疑、重来里面。\n你已经比从前更自由，也更像自己了。','a quiet kind of growing'],
star:['你的世界真的在诞生','你一直在创造世界。\n把原本只存在于脑海里的画面、情绪和规则，\n一点点变成别人也能进入的地方。\n这件事很厉害。真的。','a world of your own'],
wish:['留给未来的你','写一句想留给25岁自己的话吧。\n不用写得伟大，\n真诚就很好。','a note to tomorrow'],
path:['你不用着急成为答案','人生不是每一段路都要立刻走对。\n有时候，先走下去，\n答案才会慢慢出现。\n你不用因为还没抵达，就怀疑自己。','one step at a time'],
desk:['写给创作者','谢谢你没有放弃那些“想做点什么”的时刻。\n不是每个人都会把脑海里的想法，\n认真地带到现实里。\n你做到了，而且还会继续做到。','thank you for creating']};
const ids=Object.keys(entries),seen=new Set();let active=null,started=false,finalShown=false,candleOut=false,moonClicks=0,wish='',audio=null,soundOn=false,ambient=[],musicTimer=null,toastTimer=null,endingTimer=null,lastHotspot=null;
try{wish=localStorage.getItem('birthday24-wish')||''}catch(e){}
let seed=24;function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}for(let i=0;i<90;i++){const s=document.createElement('i');s.className='star'+(i%9===0?' cross':'');s.style.cssText=`left:${rand()*100}%;top:${rand()*95}%;width:${i%9===0?2:1}px;height:${i%9===0?2:1}px;--speed:${4+rand()*7}s;animation-delay:-${rand()*8}s`; $('sky').append(s)}
ids.forEach(()=>{const dot=document.createElement('i');dot.textContent='✦';$('dots').append(dot)});
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').classList.add('show');toastTimer=setTimeout(()=>$('toast').classList.remove('show'),4000)}
function particles(x=50,y=56,n=20,petal=false){for(let i=0;i<n;i++){const p=document.createElement('i');p.className='spark'+(petal?' petal':'');p.style.cssText=`left:${x+(rand()-.5)*20}%;top:${y+(rand()-.5)*12}%;--dx:${(rand()-.5)*120}px;animation-delay:${rand()*.7}s`; $('particles').append(p);setTimeout(()=>p.remove(),5400)}}
function chime(f=523,length=.8,volume=.025){if(!soundOn||!audio||document.hidden)return;const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.value=f;gain.gain.setValueAtTime(0,audio.currentTime);gain.gain.linearRampToValueAtTime(volume,audio.currentTime+.015);gain.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+length);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+length+.05)}
function startSound(){const A=window.AudioContext||window.webkitAudioContext;if(!A){toast('今晚先安静地听星光。');return}if(!audio)audio=new A();audio.resume().catch(()=>{});soundOn=true;$('sound').textContent='♫ 声音 · 开';$('sound').setAttribute('aria-pressed','true');[130.81,196,261.63].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,audio.currentTime);g.gain.linearRampToValueAtTime(.007/(i+1),audio.currentTime+2);o.connect(g).connect(audio.destination);o.start();ambient.push({o,g})});let k=0;const notes=[523.25,659.25,783.99,659.25,587.33,523.25,392,0];musicTimer=setInterval(()=>{if(notes[k%8])chime(notes[k%8],2.4,.009);k++},2400);chime(523,1.4,.018)}
function stopSound(){soundOn=false;clearInterval(musicTimer);ambient.forEach(({o,g})=>{g.gain.cancelScheduledValues(audio.currentTime);g.gain.setTargetAtTime(.00001,audio.currentTime,.15);o.stop(audio.currentTime+.8)});ambient=[];$('sound').textContent='♫ 声音 · 关';$('sound').setAttribute('aria-pressed','false')}
$('sound').addEventListener('click',()=>soundOn?stopSound():startSound());document.addEventListener('visibilitychange',()=>{if(audio){if(document.hidden)audio.suspend().catch(()=>{});else if(soundOn)audio.resume().catch(()=>{})}});
function update(){ $('progress-text').textContent=`今夜已点亮：${seen.size} / 8`;[...$('dots').children].forEach((dot,i)=>dot.classList.toggle('lit',i<seen.size));document.querySelectorAll('.hotspot').forEach(b=>{const done=seen.has(b.dataset.id);b.classList.toggle('done',done);b.setAttribute('aria-label',b.getAttribute('aria-label').replace('，已点亮','')+(done?'，已点亮':''))})}
function mark(id){if(!seen.has(id)){seen.add(id);update();chime(659);if(id==='window')stage.classList.add('window-visited');if(id==='flowers')stage.classList.add('bloom')}}
function showFinal(){clearTimeout(endingTimer);if(card.open||ending.open)return;finalShown=true;stage.classList.add('complete');world.classList.add('complete');particles(50,58,38);const meteor=document.createElement('i');meteor.className='meteor';$('sky').append(meteor);setTimeout(()=>meteor.remove(),4000);[523.25,659.25,783.99].forEach((f,i)=>setTimeout(()=>chime(f,2,.019),i*200));ending.showModal();$('finish').focus()}
function checkFinal(){if(seen.size===8&&!finalShown){endingTimer=setTimeout(showFinal,650)}}
function closeCard(){if(!card.open)return;card.close()}
card.addEventListener('close',()=>{if(active){mark(active);active=null}checkFinal();if(lastHotspot)lastHotspot.focus({preventScroll:true})});card.addEventListener('cancel',()=>{});$('close').addEventListener('click',closeCard);
card.addEventListener('click',e=>{if(e.target===card){const r=card.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeCard()}});
function p(text,cls=''){const el=document.createElement('p');el.textContent=text;if(cls)el.className=cls;content.append(el);return el}
function action(label,fn,cls='action'){const b=document.createElement('button');b.className=cls;b.textContent=label;b.addEventListener('click',fn);content.append(b);return b}
function open(id,button){if(!started||card.open||ending.open)return;clearTimeout(endingTimer);active=id;lastHotspot=button;const [title,text,kicker]=entries[id];$('card-title').textContent=title;$('card-kicker').textContent=kicker;content.replaceChildren();chime(id==='star'?784:523);p(text);
if(id==='cat'){stage.classList.remove('cat-petted');requestAnimationFrame(()=>stage.classList.add('cat-petted'))}
if(id==='flowers'){stage.classList.add('bloom');particles(29,60,12,true)}
if(id==='star')particles(35,27,14);
if(id==='window')stage.classList.add('window-visited');
if(id==='cake'){const picture=document.createElement('div');picture.className='cake-icon';picture.innerHTML='<svg viewBox="0 0 100 85" aria-hidden="true"><ellipse cx="50" cy="69" rx="36" ry="7" fill="#f4dbc1"/><rect x="21" y="43" width="58" height="26" rx="5" fill="#e1aebe"/><ellipse cx="50" cy="44" rx="29" ry="8" fill="#fff0d5"/><path d="M25 47v9m13-6v9m25-9v9m12-11v9" stroke="#fff0d5" stroke-width="6" stroke-linecap="round"/><rect x="48" y="24" width="4" height="20" rx="1" fill="#f5ddb5"/><path id="dialog-flame" d="M50 9Q60 23 50 26Q40 23 50 9Z" fill="#f7e7a9"/></svg>';content.prepend(picture);picture.querySelector('#dialog-flame').style.opacity=candleOut?'0':'1';const status=p(candleOut?'许愿成功。':'闭上眼，给自己一个小小的愿望。','small');const blow=action(candleOut?'愿望已经飞向星空':'轻轻吹灭蜡烛',()=>{candleOut=true;stage.classList.add('candle-out');picture.querySelector('#dialog-flame').style.opacity='0';status.textContent='许愿成功。';blow.textContent='愿望已经飞向星空';blow.disabled=true;mark('cake');particles(38,58,16);chime(392,1.2,.016)});blow.disabled=candleOut;action('把这一刻收好',closeCard,'quiet')}
else if(id==='wish'){if(wish)p('记得对未来的自己温柔一点。','small');const label=document.createElement('label');label.className='wish-label';label.htmlFor='wish-input';label.textContent='留给25岁自己的话';content.append(label);const input=document.createElement('textarea');input.id='wish-input';input.maxLength=240;input.placeholder='例如：希望明年的我，过得更自由一点。';input.value=wish;content.append(input);const save=action('封存愿望',()=>{const value=input.value.trim();if(!value){status.textContent='写下一句想留下的话吧。';input.focus();return}wish=value;try{localStorage.setItem('birthday24-wish',wish);status.textContent='已经替你收好了。';particles(70,57,12);mark('wish');chime(784)}catch(e){status.textContent='这次先替你放在这里。浏览器没有允许本地保存，关闭页面后会消失。'}});const status=p('愿望只保存在这个浏览器里。','status');status.setAttribute('role','status');action('先把心愿放在心里',closeCard,'quiet')}
else action('收下这颗星光',closeCard);
card.showModal();$('close').focus({preventScroll:true})}
document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',()=>open(b.dataset.id,b)));
$('begin').addEventListener('click',()=>{started=true;world.classList.remove('before');world.classList.add('started');$('headline').textContent='今晚，换你当玩家。';$('subtitle').textContent='那些微微发光的地方，藏着给你的话。';chime();document.querySelector('.hotspot').focus({preventScroll:true})});
$('moon-secret').addEventListener('click',()=>{if(!started)return;if(++moonClicks>=3){toast('今晚的月亮也知道，今天是个值得庆祝的日子。');chime(880);moonClicks=0}});
$('star-secret').addEventListener('click',()=>{if(started){toast('有些好事，也许正在路上，只是还没来得及敲门。');chime(784)}});
$('finish').addEventListener('click',()=>{ending.close();toast('那盏灯还在。想回来时，就回来看看。')});ending.addEventListener('close',()=>{$('final-button').focus({preventScroll:true})});
$('replay').addEventListener('click',()=>{ending.close();seen.clear();finalShown=false;candleOut=false;stage.classList.remove('complete','candle-out','bloom','window-visited','cat-petted');world.classList.remove('complete');update();toast('慢慢来，星光可以再亮一次。');document.querySelector('.hotspot').focus({preventScroll:true})});$('final-button').addEventListener('click',showFinal);
update();
})();
</script>
